## QBioCode ADMET Benchmark Configuration
## ==========================================
## Used with QProfiler to sweep all 22 TDC ADMET endpoints × all models.
## Run from the repo root:
##
##   qprofiler --config-dir=qbiocode/apps/qprofiler/configs --config-name=admet_config
##
## Or via batch mode:
##   qprofiler-batch --input-dir data/admet/{endpoint}/{featurizer} \
##                   --config qbiocode/apps/qprofiler/configs/admet_config.yaml \
##                   --data-type admet --n-jobs 40

config_file_name: 'admet_config'

# Path to input data (set per-endpoint/featurizer in batch mode)
folder_path: 'data/admet'
file_dataset: 'ALL'

# First column is NOT a row-name index (features + last col = label)
index_col: False

# ── Backend ─────────────────────────────────────────────────────────────────
# Use simulator for full sweep; switch to 'ibm_least' for top-3 endpoints
backend: 'simulator'
qiskit_json_path: '~/.qiskit/qiskit-ibm.json'

# ── Parallelism ──────────────────────────────────────────────────────────────
n_jobs: 10

# ── Embeddings ───────────────────────────────────────────────────────────────
# Embedding passes run in order. Classical models always receive 'none' (full
# fingerprint). Quantum models are automatically skipped on passes where the
# feature dimension exceeds max_qubits (see model_run.py).
#
# QML qubit budget: n_components=8  →  2^8 = 256-element statevector (trivial)
#   QEnsemble: total_qubits = 7 + 5×log2(8) = 22  (well within 26-qubit limit)
#
# Embedding taxonomy for the ADMET benchmark:
#   Linear / global structure (fit on train, transform test):
#     pca       — Principal Component Analysis (centred; captures max variance)
#     svd       — Truncated SVD / LSA (no centring; sparse-safe for fingerprints)
#     nmf       — Non-negative Matrix Factorisation (non-linear factors)
#   Non-linear / manifold (fit on train, transform test):
#     umap      — UMAP (topology-preserving; fastest non-linear option)
#     kpca      — Kernel PCA with RBF (non-linear, global)
#   Supervised / discriminative (fit on train labels):
#     mifsr     — Mutual-Information Feature Selection + Ranking (top-k original
#                 features; interpretable — each column is a real descriptor)
#     varthresh — Top-k variance features (unsupervised; filter method)
#   Manifold methods with joint embedding (train+test embedded together;
#   valid for benchmarking but NOT for deployed inference):
#     tsne      — t-SNE (perplexity-based; captures local structure)
#
# 'none' is always first so classical models run first and do not block QML.
embeddings: ['none', 'pca', 'umap']

# n_components must be a power of 2 for QEnsemble compatibility.
# 8 → 3 qubits_per_sample, 22 total qubits for QEnsemble (safe for simulator).
n_components: 8

# ── Models ───────────────────────────────────────────────────────────────────
# Full panel: standard classical + QML + MMELON foundation model baseline
# NOTE: 'pqk' commented out — CPU statevector simulation takes ~87h per task
#       (loops full quantum circuit per test sample). Run separately with GPU Aer backend.
model: ['svc', 'rf', 'mlp', 'xgb', 'lr', 'qsvc', 'vqc', 'qnn', 'qensemble', 'mmelon']

# ── Evaluation ───────────────────────────────────────────────────────────────
average: 'weighted'
multi_class: 'raise'

# Enable ADMET-specific extended metrics (AUPRC, MCC)
admet_metrics: True

# ── Seeds ────────────────────────────────────────────────────────────────────
seed: 42
q_seed: 42
shots: 1024
resil_level: 1

# ── Splits ───────────────────────────────────────────────────────────────────
test_size: 0.2
# Stratified sampling is critical — ADMET endpoints are often imbalanced
stratify: ['y']
# Maximum feature dimension for quantum models (statevector simulator limit).
# Features > max_qubits → quantum models auto-skipped for that embedding pass.
max_qubits: 26

scaling: ['True']
grid_search: False
cross_validation: 5
NN_depth: 1
# 3 train/valid splits — balances statistical robustness vs wall-time
# (reduced from 5 to fit within the night queue's 08:30 cutoff)
iter: 1

# ── Checkpointing ────────────────────────────────────────────────────────────
# Fitted model objects are saved here; best_models.json tracks the best per
# (endpoint × model) pair for downstream test-set inference.
checkpoint_dir: 'results/admet_benchmark/checkpoints'

# ── MMELON ───────────────────────────────────────────────────────────────────
mmelon_args:
  model_name: 'ibm-research/biomed.sm.mv-te-84m'
  head: 'rf'
  cache_dir: 'data/mmelon_cache'
  batch_size: 32
  max_length: 128

# ── Classical model parameters ───────────────────────────────────────────────
svc_args: {'C': 0.01, 'gamma': 0.1, kernel: 'linear'}

gridsearch_svc_args: {'C': [0.1, 1, 10, 100],
                      'gamma': [0.001, 0.01, 0.1, 1],
                      'kernel': ['linear', 'rbf', 'poly', 'sigmoid']}

dt_args: {'criterion': 'gini',
          'max_depth': null,
          'min_samples_split': 2,
          'min_samples_leaf': 1,
          'max_features': null}

gridsearch_dt_args: {'criterion': ['gini', 'entropy'],
                     'max_depth': [null, 5, 10, 20],
                     'min_samples_split': [2, 5, 10],
                     'min_samples_leaf': [1, 2, 4],
                     'max_features': [null, 'sqrt', 'log2']}

nb_args: {'var_smoothing': 1.e-09}

gridsearch_nb_args: {'var_smoothing': [1.e-09, 1.e-08, 1.e-07, 1.e-06, 1.e-05]}

lr_args: {'penalty': 'l2',
          'C': 1.0,
          'solver': 'saga',
          'max_iter': 10000}

gridsearch_lr_args: {'penalty': ['l1', 'l2'],
                     'C': [1.e-03, 1.e-02, 1.e-01, 1.e+00, 1.e+01, 1.e+02],
                     'solver': ['liblinear', 'saga'],
                     'max_iter': [5000, 10000]}

rf_args: {'n_estimators': 200,
          'max_features': 'sqrt',
          'max_depth': null,
          'min_samples_split': 2,
          'min_samples_leaf': 1,
          'bootstrap': True}

gridsearch_rf_args: {'n_estimators': [100, 200, 500],
                     'max_features': ['sqrt', 'log2'],
                     'max_depth': [10, 20, null],
                     'min_samples_split': [2, 5],
                     'min_samples_leaf': [1, 2],
                     'bootstrap': [True, False]}

mlp_args: {'hidden_layer_sizes': 100,
           'activation': 'relu',
           'max_iter': 10000,
           'solver': 'adam',
           'alpha': 0.0001,
           'learning_rate': 'constant'}

gridsearch_mlp_args: {'hidden_layer_sizes': [[50,], [100,], [100, 50]],
                      'activation': ['tanh', 'relu'],
                      'max_iter': [5000, 10000],
                      'solver': ['adam'],
                      'alpha': [0.0001, 0.001],
                      'learning_rate': ['constant', 'adaptive']}

xgb_args: {'n_estimators': 100,
           'criterion': 'gini',
           'max_depth': null,
           'subsample': 0.5,
           'learning_rate': 0.5,
           'colsample_bytree': 1,
           'min_child_weight': 1}

gridsearch_xgb_args: {'n_estimators': [100, 200, 500],
                      'max_depth': [3, 5, 10, null],
                      'subsample': [0.5, 0.75, 1.0],
                      'learning_rate': [0.01, 0.1, 0.5],
                      'colsample_bytree': [0.5, 0.75, 1.0]}

# ── QML parameters ───────────────────────────────────────────────────────────
qnn_args: {'primitive': 'estimator',
           'local_optimizer': 'COBYLA',
           'encoding': ZZ,
           'entanglement': 'linear',
           'reps': 1,
           'maxiter': 50,
           'ansatz_type': 'amp'}

qsvc_args: {'C': 0.01,
            'pegasos': False,
            'encoding': ZZ,
            'entanglement': 'linear',
            'reps': 1,
            'primitive': 'sampler'}

vqc_args: {'primitive': 'sampler',
           'local_optimizer': 'COBYLA',
           'maxiter': 50,
           'encoding': ZZ,
           'entanglement': 'linear',
           'reps': 1,
           'ansatz_type': 'amp'}

pqk_args:  {'encoding': ZZ,
           'entanglement': 'pairwise',
           'primitive': 'estimator',
           'reps': 4}

# Begin QEnsemble arguments
# n_train must be even; circuit qubits grow quickly — keep small for simulation
# device: 'GPU' uses qiskit-aer GPU backend (A100 on cluster); falls back to CPU
# if no GPU is present (execute_circuit handles this via AerSimulator device param)
qensemble_args: {'n_train': 4,
                 'n_swap': 1,
                 'd': 2,
                 'mode': 'balanced',
                 'ensemble_method': 'swap',
                 'n_shots': 8192,
                 'device': 'CPU'}

# ── Hydra output directory ────────────────────────────────────────────────────
hydra:
  run:
    dir: results/${config_file_name}/dataset=${file_dataset}/${backend}_${now:%Y-%m-%d_%H-%M-%S}
